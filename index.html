<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наири & Лолита — Свадебное приглашение</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= INTRO VIDEO ================= -->

    <div id="intro">

        <video
            id="introVideo"
            autoplay
            muted
            playsinline
            preload="auto"
        >
            <source src="intro.mp4" type="video/mp4">
        </video>

        <button id="skip" type="button">
            Пропустить →
        </button>

    </div>


    <!-- ================= MUSIC ================= -->

    <audio id="weddingMusic" loop preload="auto">
        <source src="aram-kuzes.mp3" type="audio/mpeg">
    </audio>


    <!-- ================= MUSIC BUTTON ================= -->

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Музыка"
    >
        ♫
    </button>


    <!-- ================= LANGUAGE ================= -->

    <div id="languageChoice" class="language-choice">

        <div class="language-box">

            <p class="language-heading">
                Выберите язык
            </p>

            <div class="language-buttons">

                <button id="introRu" type="button">
                    РУССКИЙ
                </button>

                <button id="introAm" type="button">
                    ՀԱՅԵՐԵՆ
                </button>

            </div>

        </div>

    </div>


    <!-- ================= MAIN SITE ================= -->

    <main id="site">


        <!-- ==================================================
             RUSSIAN VERSION
        ================================================== -->

        <div id="ru" class="language-page">


            <!-- FIRST PHOTO -->

            <section class="photo-section">

                <img
                    src="photo-rus.jpg"
                    alt="Наири и Лолита"
                >

            </section>


            <!-- SECOND PHOTO + MAP -->

            <section class="photo-section map-page">

                <img
                    src="photo1-rus.jpg"
                    alt="Наири и Лолита"
                >

                <a
                    class="map-button"
                    href="https://www.google.com/maps/search/?api=1&query=Restaurant%20Mkrtchyan%27s%20Hall%2C%202%2F10%20Echmiatsin%20St%2C%20Masis%200801%2C%20Armenia"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="map-icon">⌖</span>
                    ОТКРЫТЬ КАРТУ
                </a>

            </section>


            <!-- RSVP -->

            <section class="rsvp-section">

                <div class="rsvp-photo">

                    <img
                        src="RSVP.jpg"
                        alt="RSVP"
                    >

                    <div class="rsvp-overlay">

                        <div class="rsvp-content">

                            <div class="rsvp-title">
                                RSVP
                            </div>

                            <p class="rsvp-subtitle">
                                Подтвердите своё присутствие
                            </p>


                            <form
                                id="rsvpFormRu"
                                class="rsvp-form"
                            >

                                <label for="nameRu">
                                    Ваше имя и фамилия
                                </label>

                                <input
                                    id="nameRu"
                                    name="name"
                                    type="text"
                                    placeholder="Имя и фамилия"
                                    autocomplete="name"
                                    required
                                >


                                <label for="attendanceRu">
                                    Вы будете с нами?
                                </label>

                                <select
                                    id="attendanceRu"
                                    name="attendance"
                                    required
                                >

                                    <option
                                        value=""
                                        disabled
                                        selected
                                    >
                                        Выберите ответ
                                    </option>

                                    <option value="yes">
                                        С радостью буду ♡
                                    </option>

                                    <option value="no">
                                        К сожалению, не смогу
                                    </option>

                                </select>


                                <label for="guestsRu">
                                    Количество гостей
                                </label>
                                <label for="sideRu">
    С чьей стороны вы будете?
</label>

<select
    id="sideRu"
    name="side"
    required
>
    <option value="" disabled selected>
        Выберите сторону
    </option>

    <option value="groom">
        Со стороны жениха
    </option>

    <option value="bride">
        Со стороны невесты
    </option>
</select>

                                <select
                                    id="guestsRu"
                                    name="guests"
                                    required
                                >

                                    <option value="" disabled selected>
                                        Выберите количество
                                    </option>

                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>

                                </select>


                                <label for="messageRu">
                                    Пожелание или комментарий
                                </label>

                                <textarea
                                    id="messageRu"
                                    name="message"
                                    rows="3"
                                    placeholder="Ваше сообщение"
                                ></textarea>


                                <button
                                    id="submitRu"
                                    class="rsvp-submit"
                                    type="submit"
                                >
                                    ПОДТВЕРДИТЬ ПРИСУТСТВИЕ
                                </button>


                                <p
                                    id="noteRu"
                                    class="form-note"
                                ></p>

                                <p
                                    id="successRu"
                                    class="form-success"
                                    aria-live="polite"
                                ></p>

                            </form>

                        </div>

                    </div>

                </div>

            </section>

        </div>



        <!-- ==================================================
             ARMENIAN VERSION
        ================================================== -->

        <div id="am" class="language-page">


            <!-- FIRST PHOTO -->

            <section class="photo-section">

                <img
                    src="photo-am.jpg"
                    alt="Նաիրի և Լոլիտա"
                >

            </section>


            <!-- SECOND PHOTO + MAP -->

            <section class="photo-section map-page">

                <img
                    src="photo1-am.jpg"
                    alt="Նաիրի և Լոլիտա"
                >

                <a
                    class="map-button"
                    href="https://www.google.com/maps/search/?api=1&query=Restaurant%20Mkrtchyan%27s%20Hall%2C%202%2F10%20Echmiatsin%20St%2C%20Masis%200801%2C%20Armenia"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="map-icon">⌖</span>
                    ԲԱՑԵԼ ՔԱՐՏԵԶԸ
                </a>

            </section>


            <!-- RSVP -->

            <section class="rsvp-section">

                <div class="rsvp-photo">

                    <img
                        src="RSVP.jpg"
                        alt="RSVP"
                    >

                    <div class="rsvp-overlay">

                        <div class="rsvp-content">

                            <div class="rsvp-title">
                                RSVP
                            </div>

                            <p class="rsvp-subtitle">
                                Խնդրում ենք հաստատել Ձեր ներկայությունը
                            </p>


                            <form
                                id="rsvpFormAm"
                                class="rsvp-form"
                            >

                                <label for="nameAm">
                                    Ձեր անունը և ազգանունը
                                </label>

                                <input
                                    id="nameAm"
                                    name="name"
                                    type="text"
                                    placeholder="Անուն և ազգանուն"
                                    autocomplete="name"
                                    required
                                >


                                <label for="attendanceAm">
                                    Կլինե՞ք մեզ հետ
                                </label>

                                <select
                                    id="attendanceAm"
                                    name="attendance"
                                    required
                                >

                                    <option
                                        value=""
                                        disabled
                                        selected
                                    >
                                        Ընտրեք պատասխանը
                                    </option>

                                    <option value="yes">
                                        Սիրով կմասնակցեմ ♡
                                    </option>

                                    <option value="no">
                                        Ցավոք, չեմ կարողանա
                                    </option>

                                </select>


                                <label for="guestsAm">
                                    Հյուրերի քանակը
                                </label>
                                <label for="sideAm">
    Ո՞ր կողմից եք լինելու
</label>

<select
    id="sideAm"
    name="side"
    required
>
    <option value="" disabled selected>
        Ընտրեք կողմը
    </option>

    <option value="groom">
        Փեսայի կողմից
    </option>

    <option value="bride">
        Հարսի կողմից
    </option>
</select>

                                <select
                                    id="guestsAm"
                                    name="guests"
                                    required
                                >

                                    <option value="" disabled selected>
                                        Ընտրեք քանակը
                                    </option>

                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>

                                </select>


                                <label for="messageAm">
                                    Ցանկություն կամ մեկնաբանություն
                                </label>

                                <textarea
                                    id="messageAm"
                                    name="message"
                                    rows="3"
                                    placeholder="Ձեր հաղորդագրությունը"
                                ></textarea>


                                <button
                                    id="submitAm"
                                    class="rsvp-submit"
                                    type="submit"
                                >
                                    ՀԱՍՏԱՏԵԼ ՆԵՐԿԱՅՈՒԹՅՈՒՆԸ
                                </button>


                                <p
                                    id="noteAm"
                                    class="form-note"
                                ></p>

                                <p
                                    id="successAm"
                                    class="form-success"
                                    aria-live="polite"
                                ></p>

                            </form>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
