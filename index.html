<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Nairi & Lolita — 13.11.2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     INTRO
===================================================== -->

<div id="intro">

    <video
        id="introVideo"
        autoplay
        muted
        playsinline
        preload="auto"
    >
        <source src="intro.mp4" type="video/mp4">
    </video>

    <button id="skip" type="button">
        Пропустить →
    </button>


    <!-- ВЫБОР ЯЗЫКА -->

    <div id="languageChoice">

        <button id="introRu" type="button">
            RU
        </button>

        <button id="introAm" type="button">
            ՀԱՅ
        </button>

    </div>

</div>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="weddingMusic"
    src="aram-kuzes.mp3"
    loop
    preload="auto"
></audio>

<button
    id="musicButton"
    type="button"
    aria-label="Музыка"
>
    ♪
</button>


<!-- =====================================================
     MAIN SITE
===================================================== -->

<main id="site">


    <!-- =================================================
         RUSSIAN VERSION
    ================================================== -->

    <div id="ru" class="language-page">

        <!-- PHOTO 1 -->

        <div class="invitation-page">

            <img
                src="photo-rus.jpg"
                alt="Nairi & Lolita"
            >

        </div>


        <!-- PHOTO 2 -->

        <div class="invitation-page">

            <img
                src="photo1-rus.jpg"
                alt="Nairi & Lolita"
            >

        </div>


        <!-- RSVP PHOTO -->

        <section class="rsvp-photo-page">

            <img
                src="rsvp.jpg"
                alt="RSVP"
            >


            <!-- RSVP CONTENT -->

            <div class="rsvp-overlay">

                <div class="rsvp-title">
                    RSVP
                </div>


                <div class="rsvp-subtitle">
                    Подтвердите своё присутствие
                </div>


                <form
                    id="rsvpFormRu"
                    class="rsvp-form"
                >

                    <!-- NAME -->

                    <input
                        type="text"
                        id="nameRu"
                        placeholder="Ваше имя и фамилия"
                        autocomplete="name"
                        required
                    >


                    <!-- ATTENDANCE -->

                    <div class="rsvp-label">
                        Вы будете с нами?
                    </div>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="attendanceRu"
                            value="yes"
                            required
                        >

                        <span>
                            С радостью буду ♡
                        </span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="attendanceRu"
                            value="no"
                        >

                        <span>
                            К сожалению, не смогу
                        </span>

                    </label>


                    <!-- GUESTS -->

                    <select
                        id="guestsRu"
                        required
                    >

                        <option value="">
                            Количество гостей
                        </option>

                        <option value="1">
                            1 гость
                        </option>

                        <option value="2">
                            2 гостя
                        </option>

                        <option value="3">
                            3 гостя
                        </option>

                        <option value="4">
                            4 гостя
                        </option>

                    </select>


                    <!-- MESSAGE -->

                    <textarea
                        id="messageRu"
                        placeholder="Пожелание или комментарий"
                        rows="3"
                    ></textarea>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="submitRu"
                    >
                        ПОДТВЕРДИТЬ ПРИСУТСТВИЕ
                    </button>


                    <!-- ERROR -->

                    <div
                        id="noteRu"
                        class="rsvp-note"
                    ></div>


                    <!-- SUCCESS -->

                    <div
                        id="successRu"
                        class="rsvp-success"
                    ></div>

                </form>

            </div>

        </section>

    </div>



    <!-- =================================================
         ARMENIAN VERSION
    ================================================== -->

    <div id="am" class="language-page">

        <!-- PHOTO 1 -->

        <div class="invitation-page">

            <img
                src="photo-am.jpg"
                alt="Լոլիտա & Նաիրի"
            >

        </div>


        <!-- PHOTO 2 -->

        <div class="invitation-page">

            <img
                src="photo1-am.jpg"
                alt="Լոլիտա & Նաիրի"
            >

        </div>


        <!-- RSVP PHOTO -->

        <section class="rsvp-photo-page">

            <img
                src="rsvp.jpg"
                alt="RSVP"
            >


            <!-- RSVP CONTENT -->

            <div class="rsvp-overlay">

                <!-- ЭТОТ RSVP ЕСТЬ И НА АРМЯНСКОЙ ВЕРСИИ -->

                <div class="rsvp-title">
                    RSVP
                </div>


                <div class="rsvp-subtitle">
                    Խնդրում ենք հաստատել Ձեր ներկայությունը
                </div>


                <form
                    id="rsvpFormAm"
                    class="rsvp-form"
                >

                    <!-- NAME -->

                    <input
                        type="text"
                        id="nameAm"
                        placeholder="Ձեր անունը և ազգանունը"
                        autocomplete="name"
                        required
                    >


                    <!-- ATTENDANCE -->

                    <div class="rsvp-label">
                        Կլինե՞ք մեզ հետ
                    </div>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="attendanceAm"
                            value="yes"
                            required
                        >

                        <span>
                            Սիրով կմասնակցեմ ♡
                        </span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="attendanceAm"
                            value="no"
                        >

                        <span>
                            Ցավոք, չեմ կարողանա
                        </span>

                    </label>


                    <!-- GUESTS -->

                    <select
                        id="guestsAm"
                        required
                    >

                        <option value="">
                            Հյուրերի քանակը
                        </option>

                        <option value="1">
                            1 հյուր
                        </option>

                        <option value="2">
                            2 հյուր
                        </option>

                        <option value="3">
                            3 հյուր
                        </option>

                        <option value="4">
                            4 հյուր
                        </option>

                    </select>


                    <!-- MESSAGE -->

                    <textarea
                        id="messageAm"
                        placeholder="Ցանկություն կամ մեկնաբանություն"
                        rows="3"
                    ></textarea>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="submitAm"
                    >
                        ՀԱՍՏԱՏԵԼ ՆԵՐԿԱՅՈՒԹՅՈՒՆԸ
                    </button>


                    <!-- ERROR -->

                    <div
                        id="noteAm"
                        class="rsvp-note"
                    ></div>


                    <!-- SUCCESS -->

                    <div
                        id="successAm"
                        class="rsvp-success"
                    ></div>

                </form>

            </div>

        </section>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="script.js"></script>

</body>
</html>
