<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наири & Лолита — Свадебное приглашение</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Вступительное видео -->
    <div id="intro">
        <video id="introVideo" autoplay muted playsinline preload="auto">
            <source src="intro.mp4" type="video/mp4">
        </video>

        <button id="skip" type="button">
            Пропустить →
        </button>
    </div>

    <!-- Музыка -->
    <audio id="weddingMusic" loop>
        <source src="aram-kuzes.mp3" type="audio/mpeg">
    </audio>

    <!-- Кнопка музыки -->
    <button id="musicButton" class="music-button" type="button"
            aria-label="Включить или выключить музыку">
        ♫
    </button>

    <!-- Выбор языка -->
    <div id="languageChoice" class="language-choice">
        <p class="language-heading">Выберите язык</p>

        <div class="language-buttons">
            <button id="introRu" type="button">РУССКИЙ</button>
            <button id="introAm" type="button">ՀԱՅԵՐԵՆ</button>
        </div>
    </div>

    <!-- Основной сайт -->
    <main id="site">

        <!-- ================= РУССКАЯ ВЕРСИЯ ================= -->
        <div id="ru" class="language-page">

            <!-- Первая фотография -->
            <section class="photo-section">
                <img
                    src="photo-rus.jpg"
                    alt="Наири и Лолита"
                >
            </section>

            <!-- Вторая фотография + кнопка карты -->
            <section class="photo-section map-page">
                <img
                    src="photo1-rus.jpg"
                    alt="Свадебное приглашение"
                >

                <a
                    class="map-button"
                    href="https://www.google.com/maps/search/?api=1&query=Restaurant%20Mkrtchyan%27s%20Hall%2C%202%2F10%20Echmiatsin%20St%2C%20Masis%200801%2C%20Armenia"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="map-icon">⌖</span>
                    ОТКРЫТЬ КАРТУ
                </a>
            </section>

            <!-- RSVP -->
            <section class="rsvp-section">
                <div class="rsvp-photo">
                    <img
                        src="RSVP.jpg"
                        alt="Свадебное приглашение"
                    >

                    <div class="rsvp-overlay">
                        <div class="rsvp-content">

                            <div class="rsvp-title">RSVP</div>

                            <p class="rsvp-subtitle">
                                Подтвердите своё присутствие
                            </p>

                            <form id="rsvpFormRu" class="rsvp-form">

                                <label for="nameRu">
                                    Ваше имя и фамилия
                                </label>

                                <input
                                    id="nameRu"
                                    name="name"
                                    type="text"
                                    placeholder="Имя и фамилия"
                                    required
                                >

                                <label for="attendanceRu">
                                    Вы будете с нами?
                                </label>

                                <select
                                    id="attendanceRu"
                                    name="attendance"
                                    required
                                >
                                    <option value="" disabled selected>
                                        Выберите ответ
                                    </option>

                                    <option value="С радостью буду">
                                        С радостью буду ♡
                                    </option>

                                    <option value="К сожалению, не смогу">
                                        К сожалению, не смогу
                                    </option>
                                </select>

                                <label for="guestsRu">
                                    Количество гостей
                                </label>

                                <select id="guestsRu" name="guests" required>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>

                                <label for="messageRu">
                                    Пожелание или комментарий
                                </label>

                                <textarea
                                    id="messageRu"
                                    name="message"
                                    rows="3"
                                    placeholder="Ваше сообщение"
                                ></textarea>

                                <button
                                    id="submitRu"
                                    class="rsvp-submit"
                                    type="submit"
                                >
                                    ПОДТВЕРДИТЬ ПРИСУТСТВИЕ
                                </button>

                                <p id="noteRu" class="form-note"></p>
                                <p id="successRu" class="form-success"
                                   aria-live="polite"></p>

                            </form>
                        </div>
                    </div>
                </div>
            </section>

        </div>


        <!-- ================= АРМЯНСКАЯ ВЕРСИЯ ================= -->
        <div id="am" class="language-page">

            <!-- Առաջին լուսանկար -->
            <section class="photo-section">
                <img
                    src="photo-am.jpg"
                    alt="Նաիրի և Լոլիտա"
                >
            </section>

            <!-- Երկրորդ լուսանկար + քարտեզի կոճակ -->
            <section class="photo-section map-page">
                <img
                    src="photo1-am.jpg"
                    alt="Հարսանեկան հրավեր"
                >

                <a
                    class="map-button"
                    href="https://www.google.com/maps/search/?api=1&query=Restaurant%20Mkrtchyan%27s%20Hall%2C%202%2F10%20Echmiatsin%20St%2C%20Masis%200801%2C%20Armenia"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="map-icon">⌖</span>
                    ԲԱՑԵԼ ՔԱՐՏԵԶԸ
                </a>
            </section>

            <!-- RSVP -->
            <section class="rsvp-section">
                <div class="rsvp-photo">
                    <img
                        src="RSVP.jpg"
                        alt="Հարսանեկան հրավեր"
                    >

                    <div class="rsvp-overlay">
                        <div class="rsvp-content">

                            <div class="rsvp-title">RSVP</div>

                            <p class="rsvp-subtitle">
                                Խնդրում ենք հաստատել Ձեր ներկայությունը
                            </p>

                            <form id="rsvpFormAm" class="rsvp-form">

                                <label for="nameAm">
                                    Ձեր անունը և ազգանունը
                                </label>

                                <input
                                    id="nameAm"
                                    name="name"
                                    type="text"
                                    placeholder="Անուն և ազգանուն"
                                    required
                                >

                                <label for="attendanceAm">
                                    Կլինե՞ք մեզ հետ
                                </label>

                                <select
                                    id="attendanceAm"
                                    name="attendance"
                                    required
                                >
                                    <option value="" disabled selected>
                                        Ընտրեք պատասխանը
                                    </option>

                                    <option value="Սիրով կմասնակցեմ">
                                        Սիրով կմասնակցեմ ♡
                                    </option>

                                    <option value="Ցավոք, չեմ կարողանա">
                                        Ցավոք, չեմ կարողանա
                                    </option>
                                </select>

                                <label for="guestsAm">
                                    Հյուրերի քանակը
                                </label>

                                <select id="guestsAm" name="guests" required>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>

                                <label for="messageAm">
                                    Ցանկություն կամ մեկնաբանություն
                                </label>

                                <textarea
                                    id="messageAm"
                                    name="message"
                                    rows="3"
                                    placeholder="Ձեր հաղորդագրությունը"
                                ></textarea>

                                <button
                                    id="submitAm"
                                    class="rsvp-submit"
                                    type="submit"
                                >
                                    ՀԱՍՏԱՏԵԼ ՆԵՐԿԱՅՈՒԹՅՈՒՆԸ
                                </button>

                                <p id="noteAm" class="form-note"></p>
                                <p id="successAm" class="form-success"
                                   aria-live="polite"></p>

                            </form>
                        </div>
                    </div>
                </div>
            </section>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
